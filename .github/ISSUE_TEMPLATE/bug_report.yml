name: Bug report
description: Report a problem with InstanceMate
title: "[bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Never include real credentials, API keys, tokens, or actual ServiceNow instance data (URLs, record data, screenshots with real data) in this issue.** Use placeholders or a sanitized/redacted example instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Ask the assistant '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: llm-provider
    attributes:
      label: LLM provider / model
      description: e.g. OpenAI gpt-4o, Anthropic claude-sonnet-5, Google gemini-1.5-pro
    validations:
      required: false

  - type: dropdown
    id: servicenow-release
    attributes:
      label: ServiceNow release family
      options:
        - Xanadu
        - Yokohama
        - Zurich
        - Other
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. This will be rendered as a code block, so no need for backticks. Redact anything sensitive.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: no-sensitive-data
    attributes:
      label: Confirmation
      options:
        - label: I confirm this report does not contain credentials, API keys, tokens, or real/sensitive ServiceNow instance data.
          required: true
