name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check for Python code
        id: pycheck
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ruff
        if: steps.pycheck.outputs.found == 'true'
        run: pip install ruff

      - name: Ruff lint
        if: steps.pycheck.outputs.found == 'true'
        run: ruff check .

      - name: Install project + test deps
        if: steps.pycheck.outputs.found == 'true'
        run: |
          for dir in backend mcp-server; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r "$dir/requirements.txt"
            fi
            if [ -f "$dir/pyproject.toml" ]; then
              pip install "./$dir"
            fi
          done
          pip install pytest

      - name: Run tests
        if: steps.pycheck.outputs.found == 'true'
        run: |
          # Run each Python service's tests separately (not one pytest from
          # the repo root): backend/ and mcp-server/ both have a top-level
          # `app` package and a `tests` package, which collide if pytest
          # tries to import both into the same process.
          ran_any=false
          for dir in backend mcp-server; do
            if find "$dir" -path '*/tests/*' -name 'test_*.py' 2>/dev/null | grep -q .; then
              echo "Running tests in $dir"
              (cd "$dir" && pytest)
              ran_any=true
            fi
          done
          if [ "$ran_any" = false ]; then
            echo "No tests found yet, skipping."
          fi

      - name: No Python code yet
        if: steps.pycheck.outputs.found == 'false'
        run: echo "No Python code found yet, skipping lint and tests."
